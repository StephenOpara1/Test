<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body style="background-color: rgb(0, 83, 63); padding: 1rem;">
    <hr>
    <h1 style="color: white;">Hello AestheticsByLozik Team! Please enter password to continue</h1>
    <form method="post" action="/admin157F">
        <input type="text" placeholder="password" name="password" style="padding: 10px;"/><br><br>
        <button style="padding: 10px; background-color: green; border: none;" type="submit">Submit</button>
    </form>
    <hr>

    <script>

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const formData = {password: loginForm.password.value};
            
            fetch("/admin157F", {
                method:"post",
                headers:{
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            }).then(response => response.json())
            .then(data => {
                alert(data.res)
            }).catch(error => {
                alert(error)
            })
        })
    </script>
</body>
</html>
